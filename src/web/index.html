function targets(){
  const picked = S.candidates.filter(c => c.checked && c.domain).map(c => ({domain:c.domain, name:c.name}));
  const lines = ($("#paste")?.value || "").split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"));
  const pasted = lines.map(l => { const [dm, ...n] = l.split(","); return {domain: dm.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").split("/")[0], name: n.join(",").trim() || null}; });
  const bad = pasted.filter(t => !/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(t.domain));
  const hint = $("#pastehint"); if(hint) hint.textContent = bad.length ? `Skipping ${plural(bad.length, "line")} that isn't a domain: ${bad.slice(0, 3).map(b => b.domain).join(", ")}` : "";
  const seen = new Set();
  return [...picked, ...pasted.filter(t => !bad.includes(t))].filter(t => { if(seen.has(t.domain)) return false; seen.add(t.domain); return true; });
}
function refreshCount(){ const b = $("#research"); if(!b) return; const n = targets().length; b.textContent = S.researching ? "Researching…" : `Research ${plural(n, "account")}`; b.disabled = !n || S.researching; }
function renderCands(){
  const note = {new:"", check_domain:"Website is a best guess; check it", researched:"Already researched", excluded:"Existing customer", no_domain:"Website not found"};
  $("#cands").innerHTML = S.candidates.length ? S.candidates.map((c, i) => `<label class="cand ${c.status !== "new" ? "off" : ""}"><input type="checkbox" data-i="${i}" ${c.checked ? "checked" : ""} ${c.domain && c.status !== "excluded" ? "" : "disabled"}>
    <span><span class="row" style="gap:6px"><b>${esc(c.name)}</b>${c.domain ? `<span class="mono muted sm">${esc(c.domain)}</span>` : ""}${c.round ? `<span class="chip act">${esc(c.round)}</span>` : ""}${note[c.status] ? `<span class="xs muted">${note[c.status]}</span>` : ""}</span>
    <span class="q">“${esc(c.quote)}” <a href="${esc(safeUrl(c.source_url))}" target="_blank" rel="noopener noreferrer">source</a>${c.date ? `, ${esc(c.date)}` : ""}</span></span></label>`).join("")
    : `<div class="empty"><b>No clear funding headlines this time</b><span>Try again later, or paste domains instead.</span></div>`;
  $$("#cands input").forEach(cb => cb.onchange = e => { S.candidates[+e.target.dataset.i].checked = e.target.checked; refreshCount(); });
}
async function runResearch(){
  const list = targets(); if(!list.length) return;
  S.researching = true; refreshCount();
  const items = list.map(t => ({...t, state:"waiting"}));
  let done = 0;
  const draw = () => { const q = $("#queue"); if(!q) return; $("#qprog").hidden = false; $("#qbar").style.width = `${100 * done / items.length}%`;
    q.innerHTML = items.map(i => `<div class="qi"><span class="st">${i.state === "running" ? '<span class="spin"></span>' : i.state === "done" ? icon(i.status === "go" ? "check" : "dot") : icon("clock")}</span>
      <span><b>${esc(i.name || i.domain)}</b> <span class="mono muted sm">${esc(i.domain)}</span>${i.reason ? `<br><span class="xs muted">${esc(i.reason.slice(0, 160))}</span>` : ""}</span>
      <span class="row">${i.status ? `${badge(i.status)}${i.status !== "excluded" && i.status !== "error" ? ` <a class="btn small" href="#account/${encodeURIComponent(i.domain)}">Open</a>` : ""}` : `<span class="xs muted">${i.state === "running" ? "Researching…" : "Waiting"}</span>`}</span></div>`).join(""); };
  draw();
  for(const it of items){
    it.state = "running"; draw();
    try { Object.assign(it, await post("/api/research", {domain: it.domain, name: it.name})); }
    catch(err){ it.status = err.code === "not_configured" ? "excluded" : "retry"; it.reason = err.message; if(err.code === "not_configured"){ it.state = "done"; done++; draw(); toast(err.message, "err"); break; } }
    it.state = "done"; done++; draw(); invalidate("accounts", "overview");
  }
  S.researching = false; refreshCount();
  if(items.every(i => i.state === "done")) toast(`Research finished for ${plural(items.length, "account")}`);
}

/* ============================================================== learning */
async function vLearning(){
  crumbs([["Learning"]]);
  const {lessons, feedback} = await load("lessons", true);
  const order = {pending:0, approved:1, rejected:2};
  const ls = [...lessons].sort((a, b) => order[a.status] - order[b.status] || a.id - b.id);
  const lhtml = ls.length ? ls.map(l => `<div class="lesson"><div class="spread"><div class="row">${badge(l.status)}<span class="chip">#${esc(l.id)}</span></div>
      ${l.status === "pending" ? `<div class="row"><button class="btn small primary" data-lesson="${l.id}" data-s="approved">${icon("check")}Approve</button><button class="btn small" data-lesson="${l.id}" data-s="rejected">Reject</button></div>` : `<button class="btn small ghost" data-lesson="${l.id}" data-s="pending">Undo</button>`}</div>
      <span class="txt">${esc(l.text)}</span><span class="why">${esc(l.rationale || "")}${(l.evidence || []).length ? ` Based on feedback ${l.evidence.map(i => `#${esc(i)}`).join(", ")}.` : ""}</span></div>`).join("")
    : `<div class="empty">${icon("spark")}<b>No lessons yet</b><span>Rate or edit a couple of drafts, or let the agent record reply outcomes, then choose “Learn from feedback”.</span></div>`;
  const ftable = feedback.length ? `<div class="tablewrap"><table class="data"><thead><tr><th>#</th><th>Account</th><th>Signal</th><th>Lessons used</th><th>When</th></tr></thead><tbody>${feedback.map(f => `<tr><td class="mono muted">${f.id}</td><td><a href="#account/${encodeURIComponent(f.domain)}">${esc(f.domain)}</a></td>
      <td>${[f.reply_status ? `Reply: <b>${esc(f.reply_status.replace(/_/g, " "))}</b>` : "", f.rating ? `Rated <b>${f.rating}/5</b>` : "", f.edited_body ? "Edited version" : "", f.notes ? `“${esc(f.notes)}”` : ""].filter(Boolean).join(", ")}</td>
      <td class="mono sm">${(f.lessons_used || []).map(i => "#" + i).join(", ") || `<span class="faint">none</span>`}</td><td class="muted sm num">${esc(fmtStamp(f.created_at))}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty" style="padding:22px">No feedback yet.</div>`;
  return `
    <div class="page-head"><div><h1>Learning</h1><p>Reply outcomes and your ratings become short writing lessons. Nothing changes the drafts until you approve it, and every draft records which lessons it used, so their outcomes test them.</p></div>
      <button class="btn primary" id="learn">${icon("spark")}Learn from feedback</button></div>
    <div class="stack">
      <div class="loop"><div><span class="n">1</span><b>Signals</b>Reply outcomes, ratings and edited versions.</div><div><span class="n">2</span><b>Lessons</b>At most three, each citing the feedback behind it.</div><div><span class="n">3</span><b>Approval</b>Only approved lessons are used.</div><div><span class="n">4</span><b>Next drafts</b>New emails follow them and record which.</div></div>
      <section class="panel"><header><h2>Lessons</h2><span class="chip">${ls.length}</span></header><div class="body flush">${lhtml}</div></section>
      <section class="panel"><header><h2>Feedback signals</h2><span class="chip">${feedback.length}</span></header><div class="body flush">${ftable}</div></section>
    </div>`;
}

/* ============================================================== settings */
async function vSettings(){
  crumbs([["Settings"]]);
  const s = await load("settings", true);
  const order = ["llm","hunter","database","google","own_email","auth","crm","scheduler"];
  const label = {llm:"AI model", hunter:"Hunter (contacts)", database:"Database", google:"Gmail and Calendar", own_email:"Your inbox", auth:"Access control", crm:"HubSpot CRM", scheduler:"Reply scheduler"};
  const checks = order.map(k => { const v = s.integrations[k]; const st = v.ok ? "y" : v.optional ? "o" : "n";
    return `<div class="check"><span class="ok ${st}">${icon(v.ok ? "check" : v.optional ? "dot" : "x")}</span><div><b>${label[k]}</b>${k === "llm" ? ` <span class="chip">${esc(v.provider)}</span>` : ""}<p>${esc(v.used_for)}</p></div>
      <div>${v.ok ? badge("pass", "Connected") : `<code>${esc(v.needs)}</code>`}</div></div>`; }).join("");
  return `
    <div class="page-head"><div><h1>Settings</h1><p>What this deployment is connected to, and the rules it qualifies against. Secrets are set as environment variables and are never shown here.</p></div></div>
    <div class="stack">
      <div class="grid g-2-3">
        <section class="panel"><header><div><h2>Connections</h2><div class="sub">Set missing values in Vercel → Settings → Environment Variables, then redeploy.</div></div></header><div class="body flush"><div class="checks">${checks}</div></div></section>
        <div class="stack">
          <section class="panel"><header><div><h2>Qualification gates</h2><div class="sub">Checked in this order; the first failure stops research.</div></div></header><div class="body"><table class="kv"><tbody>${s.gates.map(g => `<tr><td><span class="mono">${esc(g.id)}</span> ${esc(g.name)}</td><td>${g.scoring_only ? "Adds points only" : "Must pass"}</td></tr>`).join("")}</tbody></table></div></section>
          <section class="panel"><header><div><h2>Ranking factors</h2><div class="sub">Scored only for qualified accounts. Unknown scores zero.</div></div></header><div class="body"><table class="kv"><tbody>${s.weighted.map(w => `<tr><td>${esc(w.name)}</td><td class="num">+${w.weight}</td></tr>`).join("")}</tbody></table></div></section>
          <section class="panel"><header><h2>Limits per company</h2></header><div class="body"><table class="kv"><tbody>
            <tr><td>Research passes</td><td class="num">${s.caps.max_passes}</td></tr><tr><td>Pages fetched from its site</td><td class="num">${s.caps.max_pages_per_company}</td></tr>
            <tr><td>Free API calls</td><td class="num">${s.caps.max_free_api_calls_per_company}</td></tr><tr><td>Model calls</td><td class="num">${s.caps.max_llm_calls_per_company}</td></tr>
            <tr><td>Companies per run</td><td class="num">${s.max_companies_per_run}</td></tr><tr><td>Email length</td><td class="num">${s.email.max_words} words</td></tr>
            <tr><td>Models</td><td class="mono sm">${(s.llm.models || []).map(esc).join(", ")}</td></tr></tbody></table></div></section>
          <section class="panel"><header><div><h2>Contact priority</h2><div class="sub">The highest-ranked title with a verified email wins.</div></div></header><div class="body"><div class="row">${s.titles.map((t, i) => `<span class="chip"><span class="faint">${i+1}</span>&nbsp;${esc(t)}</span>`).join("")}</div></div></section>
        </div>
      </div>
    </div>`;
}

/* ============================================================== bindings */
function bind(name){
  $$("[data-copy]").forEach(b => b.onclick = e => { e.preventDefault(); copy(b.dataset.copy); });
  bindRows($("#main"));
  if(name === "accounts"){ drawAccounts(); $("#q").oninput = e => { S.accQuery = e.target.value; $("#gsearch").value = S.accQuery; drawAccounts(); }; }
  if(name === "account"){
    const cm = $("#copymail"); if(cm) cm.onclick = () => copy(S.mail);
    const sub = $("#subnav");
    if(sub){ $$("a", sub).forEach(a => a.onclick = e => { e.preventDefault(); $(`#sec-${a.dataset.sec}`)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); $$("a", sub).forEach(x => x.classList.toggle("on", x === a)); }); }
    const st = $("#start");
    if(st) st.onclick = async () => { st.disabled = true; st.innerHTML = '<span class="spin"></span>Sending…';
      try { const r = await post("/api/agent/start", {domain: st.dataset.d}); if(r.ok){ toast("Sent to your inbox. Reply to it as the prospect would."); invalidate("threads", "overview"); route(); } else { toast(r.error, "err"); st.disabled = false; st.innerHTML = `${icon("send")}Send to my inbox and start the agent`; } }
      catch(err){ toast(err.message, "err"); st.disabled = false; st.innerHTML = `${icon("send")}Send to my inbox and start the agent`; } };
    const f = $("#fb");
    if(f){
      $$(".stars button", f).forEach(b => b.onclick = () => { S.rating = S.rating === +b.dataset.r ? null : +b.dataset.r; $$(".stars button", f).forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.r === S.rating))); });
      f.onsubmit = async e => { e.preventDefault(); const fd = new FormData(f); const btn = $("button[type=submit]", f); btn.disabled = true;
        try { await post("/api/feedback", {domain: f.dataset.d, rating: S.rating, edited_body: fd.get("edited"), notes: fd.get("notes")}); toast("Feedback saved as a learning signal"); f.reset(); S.rating = null; $$(".stars button", f).forEach(x => x.setAttribute("aria-pressed", "false")); invalidate("lessons", "overview"); }
        catch(err){ toast(err.message, "err"); } finally { btn.disabled = false; } };
    }
  }
  if(name === "agent"){
    drawThread();
    $$("#tlist button").forEach(b => b.onclick = () => { S.thread = b.dataset.t; $$("#tlist button").forEach(x => x.setAttribute("aria-current", String(x === b))); history.replaceState(null, "", `#agent/${encodeURIComponent(S.thread)}`); drawThread(); });
    $("#tick").onclick = async () => { const b = $("#tick"); b.disabled = true; b.innerHTML = '<span class="spin"></span>Checking…';
      try { const r = await post("/api/agent/tick"); toast(r.ticked.length ? `Checked ${plural(r.ticked.length, "conversation")}` : "No conversations in progress"); invalidate("threads", "overview", "lessons"); route(); }
      catch(err){ toast(err.message, "err"); b.disabled = false; b.innerHTML = `${icon("refresh")}Check replies now`; } };
  }
  if(name === "find"){
    $("#paste").oninput = refreshCount;
    if(S.candidates.length) renderCands();
    $("#discover").onclick = async () => { const b = $("#discover"); b.disabled = true; b.innerHTML = '<span class="spin"></span>Searching…';
      $("#cands").innerHTML = `<div class="empty"><span class="spin"></span><span>Reading funding headlines and matching websites…</span></div>`;
      try { const r = await post("/api/discover"); S.candidates = (r.candidates || []).map(c => ({...c, checked: c.status === "new"})); renderCands(); refreshCount(); }
      catch(err){ $("#cands").innerHTML = `<div class="empty">${icon("alert")}<b>Search didn't finish</b><span>${esc(err.message)}</span></div>`; }
      finally { b.disabled = false; b.innerHTML = `${icon("radar")}Search news`; } };
    $("#research").onclick = runResearch;
    refreshCount();
  }
  if(name === "learning"){
    $("#learn").onclick = async () => { const b = $("#learn"); b.disabled = true; b.innerHTML = '<span class="spin"></span>Reading feedback…';
      try { const r = await post("/api/lessons/propose"); toast(r.ok ? `${plural((r.added || []).length, "new lesson")} to review` : (r.error || "No new lessons"), r.ok ? "ok" : "err"); invalidate("lessons", "overview"); route(); }
      catch(err){ toast(err.message, "err"); b.disabled = false; b.innerHTML = `${icon("spark")}Learn from feedback`; } };
    $$("[data-lesson]").forEach(b => b.onclick = async () => { b.disabled = true;
      try { await post(`/api/lessons/${b.dataset.lesson}`, {status: b.dataset.s}); toast({approved:"Approved. New drafts will follow it.", rejected:"Rejected. It won't be used.", pending:"Moved back to awaiting approval."}[b.dataset.s]); invalidate("lessons", "overview"); route(); }
      catch(err){ toast(err.message, "err"); b.disabled = false; } });
  }
}

/* ============================================================== auth + boot */
function authView(title, body){
  $("#app").innerHTML = `<div class="auth"><div class="card"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>${esc(S.config?.app_name || "Prospect Studio")}</b></div><h1>${title}</h1>${body}</div></div>`;
}
async function boot(){
  try { const t = localStorage.getItem("od-theme"); if(t) document.documentElement.dataset.theme = t; } catch {}
  try { S.config = await api("/api/config", {}, 20000); TZ = S.config.timezone || TZ; } catch(e){ S.config = {app_name:"Prospect Studio", seller:{}}; }
  try { S.me = await api("/api/me", {}, 20000); }
  catch(e){ authView("Can't reach the server", `<p class="muted">${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Try again</button>`); return; }
  if(S.me.setup_required){
    authView("Finish setting up", `<p class="muted">This deployment has no password yet, so it stays locked. In Vercel, open Project → Settings → Environment Variables and add <code class="mono">APP_PASSWORD</code> (or <code class="mono">OPEN_ACCESS=1</code> to make it public, or <code class="mono">DEMO_MODE=1</code> for a sample workspace). Then redeploy.</p>`);
    return;
  }
  if(!S.me.authed){
    authView("Sign in", `<p class="muted">This workspace is password-protected.</p><form id="login" class="stack" style="gap:12px"><label class="f">Password<input type="password" id="pw" autocomplete="current-password" required></label><button class="btn primary" type="submit">Sign in</button><p class="err" id="lerr" hidden></p></form>`);
    $("#pw").focus();
    $("#login").onsubmit = async e => { e.preventDefault(); const b = $("#login button"); b.disabled = true;
      try { await post("/api/login", {password: $("#pw").value}); boot(); } catch(err){ $("#lerr").textContent = err.message; $("#lerr").hidden = false; b.disabled = false; } };
    return;
  }
  shell();
  healthDots();
  if(S.config.seller?.name) api(`/api/seller?name=${encodeURIComponent(S.config.seller.name)}`, {}, 20000)
    .then(s => { $("#credits").textContent = s.hunter?.remaining != null ? `${Math.round(s.hunter.remaining * 10) / 10} credits` : "Hunter off"; })
    .catch(() => { $("#credits").textContent = ""; });
  Promise.all([load("accounts"), load("threads"), load("lessons")]).then(counts).catch(() => {});
  if(!boot.bound){ window.addEventListener("hashchange", route); boot.bound = true; }
  route();
}
boot();
</script>
