<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Prospect Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='8' y='15' width='3' height='9' rx='1.5' fill='%23fff'/%3E%3Crect x='13' y='10' width='3' height='14' rx='1.5' fill='%23fff'/%3E%3Crect x='18' y='7' width='3' height='17' rx='1.5' fill='%23fff'/%3E%3Crect x='23' y='13' width='3' height='11' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ---------------------------------------------------------------------------------------------
   Prospect Studio — evidence-based outbound, redesigned.
   Look: aurora backdrop, floating glass sidebar, soft 20px cards, violet→cyan gradient accent.
   Signature element: the gate strip — pill segments, one per qualification gate.
   --------------------------------------------------------------------------------------------- */
:root{
  --paper:#f5f4fb; --surface:rgba(255,255,255,.78); --solid:#ffffff; --raised:rgba(124,58,237,.035); --sunk:#eeecf6;
  --ink:#16132b; --ink-2:#3b3757; --muted:#6c6888; --faint:#a19dbb; --rule:rgba(40,30,90,.08); --rule-2:rgba(40,30,90,.14);
  --side:#120f24; --side-2:rgba(255,255,255,.06); --side-ink:#f1efff; --side-muted:#9b96bf; --side-rule:rgba(255,255,255,.08);
  --act:#7c3aed; --act-2:#6d28d9; --act-soft:rgba(124,58,237,.10); --act-ink:#ffffff;
  --grad:linear-gradient(135deg,#7c3aed 0%,#a855f7 45%,#06b6d4 100%);
  --grad-soft:linear-gradient(135deg,rgba(124,58,237,.14),rgba(6,182,212,.12));
  --pass:#059669; --pass-soft:rgba(16,185,129,.12); --pass-bar:#10b981;
  --fail:#e11d48; --fail-soft:rgba(244,63,94,.11); --fail-bar:#f43f5e;
  --rev:#d97706; --rev-soft:rgba(245,158,11,.13); --rev-bar:#f59e0b;
  --info:#7c3aed; --info-soft:rgba(124,58,237,.10);
  --na:#d6d3e6;
  --aurora-1:rgba(168,85,247,.20); --aurora-2:rgba(6,182,212,.16); --aurora-3:rgba(244,114,182,.12);
  --shadow-1:0 1px 2px rgba(30,20,80,.04),0 8px 24px -12px rgba(30,20,80,.12);
  --shadow-pop:0 24px 60px -12px rgba(40,20,110,.28),0 4px 12px rgba(40,20,110,.08);
  --glow:0 8px 24px -6px rgba(124,58,237,.55);
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-s:8px; --r-m:14px; --r-l:20px;
  --side-w:264px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#08070f; --surface:rgba(23,20,40,.72); --solid:#15122a; --raised:rgba(255,255,255,.03); --sunk:rgba(255,255,255,.06);
  --ink:#f3f1ff; --ink-2:#cfcbe8; --muted:#9a95bd; --faint:#69648a; --rule:rgba(255,255,255,.07); --rule-2:rgba(255,255,255,.12);
  --side:#0d0b1a; --side-2:rgba(255,255,255,.05); --side-rule:rgba(255,255,255,.07);
  --act:#a78bfa; --act-2:#c4b5fd; --act-soft:rgba(167,139,250,.14); --act-ink:#ffffff;
  --pass:#34d399; --pass-soft:rgba(52,211,153,.13); --pass-bar:#10b981;
  --fail:#fb7185; --fail-soft:rgba(251,113,133,.13); --fail-bar:#f43f5e;
  --rev:#fbbf24; --rev-soft:rgba(251,191,36,.13); --rev-bar:#f59e0b;
  --info:#a78bfa; --info-soft:rgba(167,139,250,.14); --na:#2e2a48;
  --aurora-1:rgba(124,58,237,.28); --aurora-2:rgba(6,182,212,.16); --aurora-3:rgba(236,72,153,.12);
  --shadow-1:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-pop:0 24px 60px -12px rgba(0,0,0,.7),0 4px 12px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#08070f; --surface:rgba(23,20,40,.72); --solid:#15122a; --raised:rgba(255,255,255,.03); --sunk:rgba(255,255,255,.06);
  --ink:#f3f1ff; --ink-2:#cfcbe8; --muted:#9a95bd; --faint:#69648a; --rule:rgba(255,255,255,.07); --rule-2:rgba(255,255,255,.12);
  --side:#0d0b1a; --side-2:rgba(255,255,255,.05); --side-rule:rgba(255,255,255,.07);
  --act:#a78bfa; --act-2:#c4b5fd; --act-soft:rgba(167,139,250,.14); --act-ink:#ffffff;
  --pass:#34d399; --pass-soft:rgba(52,211,153,.13); --pass-bar:#10b981;
  --fail:#fb7185; --fail-soft:rgba(251,113,133,.13); --fail-bar:#f43f5e;
  --rev:#fbbf24; --rev-soft:rgba(251,191,36,.13); --rev-bar:#f59e0b;
  --info:#a78bfa; --info-soft:rgba(167,139,250,.14); --na:#2e2a48;
  --aurora-1:rgba(124,58,237,.28); --aurora-2:rgba(6,182,212,.16); --aurora-3:rgba(236,72,153,.12);
  --shadow-1:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-pop:0 24px 60px -12px rgba(0,0,0,.7),0 4px 12px rgba(0,0,0,.4); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 520px at 85% -10%,var(--aurora-1),transparent 60%),
             radial-gradient(700px 480px at 10% 110%,var(--aurora-2),transparent 60%),
             radial-gradient(600px 400px at 45% 40%,var(--aurora-3),transparent 65%)}
a{color:var(--act);text-underline-offset:3px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.022em;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:2px;border-radius:6px}
::selection{background:rgba(124,58,237,.25)}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.sm{font-size:13px} .xs{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------------------------------------------------------- shell */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:12px;margin:12px 0 12px 12px;
  height:calc(100vh - 24px);height:calc(100dvh - 24px);border-radius:24px;border:1px solid rgba(255,255,255,.06);
  padding:20px 14px 16px;overflow-y:auto;box-shadow:var(--shadow-pop);
  background-image:radial-gradient(260px 200px at 0% 0%,rgba(124,58,237,.35),transparent 70%),radial-gradient(240px 220px at 100% 100%,rgba(6,182,212,.18),transparent 70%)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;color:var(--side-ink);text-decoration:none}
.brand .mark{display:flex;gap:2px;align-items:flex-end;justify-content:center;width:34px;height:34px;padding:9px 0;border-radius:11px;background:var(--grad);box-shadow:var(--glow)}
.brand .mark i{width:3.5px;border-radius:2px;background:#fff;display:block;height:8px}
.brand .mark i:nth-child(2){height:13px} .brand .mark i:nth-child(3){height:16px;opacity:.9} .brand .mark i:last-child{height:10px;opacity:.75}
.brand b{font-weight:800;font-size:16px;letter-spacing:-.02em}
.ws{margin:0 4px 18px;padding:12px 14px;border:1px solid var(--side-rule);border-radius:16px;background:var(--side-2)}
.ws .k{font-size:11px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.ws .v{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px}
.ws .v span{font-size:11.5px;font-weight:600;color:#c4b5fd;background:rgba(167,139,250,.14);padding:1px 8px;border-radius:999px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:#b9b4d8;text-decoration:none;font-weight:600;transition:background .15s,color .15s}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a[aria-current="page"]{background:linear-gradient(135deg,rgba(124,58,237,.55),rgba(6,182,212,.30));color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 8px 20px -10px rgba(124,58,237,.8)}
.nav a[aria-current="page"] svg{color:#fff}
.nav a .count{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--side-muted);font-variant-numeric:tabular-nums}
.nav a .count.hot{color:#1a1300;background:#fbbf24;border-radius:999px;padding:0 7px}
.nav .grp{font-size:10.5px;color:var(--side-muted);padding:18px 12px 6px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:14px 8px 0;border-top:1px solid var(--side-rule)}
.health{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--side-muted)}
.health span{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--side-2)}
.health i{width:6px;height:6px;border-radius:50%;background:#4b4670;display:block}
.health i.on{background:#34d399;box-shadow:0 0 8px #34d399}
.side-foot .links{display:flex;gap:12px;font-size:12px;align-items:center}
.side-foot .links a,.side-foot .links button{color:var(--side-muted);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.side-foot .links a:hover,.side-foot .links button:hover{color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:12px;z-index:20;margin:12px 20px 0 20px;border-radius:18px;background:color-mix(in srgb,var(--solid) 70%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--rule);box-shadow:var(--shadow-1);
  padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;min-height:58px}
.top .menu{display:none}
.crumbs{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--faint)}
.crumbs .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{margin-left:auto;position:relative;width:min(340px,40vw)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input[type=search]{width:100%;height:38px;padding:0 40px 0 38px;border:1px solid var(--rule);border-radius:999px;background:var(--sunk)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);color:var(--muted);background:var(--solid);border:1px solid var(--rule);border-radius:6px;padding:0 6px}
.content{padding:28px 20px calc(56px + env(safe-area-inset-bottom)) 20px;width:100%;max-width:1360px}
.banner{margin:0 0 22px;display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:var(--r-m);background:var(--grad-soft);color:var(--ink-2);font-size:13px;border:1px solid color-mix(in srgb,var(--act) 22%,transparent)}
.banner svg{color:var(--act);margin-top:2px}
.banner.warn{background:var(--rev-soft);border-color:color-mix(in srgb,var(--rev) 25%,transparent)} .banner.warn svg{color:var(--rev)}

@media (max-width:920px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;margin:10px;height:calc(100dvh - 20px);width:min(84vw,300px);z-index:60;transform:translateX(-110%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block}
  .top{margin:10px 10px 0}
  .top .menu{display:inline-flex}
  .search{width:auto;flex:1 1 140px;max-width:260px}
  .search kbd{display:none}
  .content{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
}
@media (max-width:560px){.top-cta span{display:none}.top-cta{width:38px;padding:0}.search{max-width:none}}
.scrim{display:none;position:fixed;inset:0;background:rgba(8,6,20,.5);backdrop-filter:blur(4px);z-index:55}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* ---------------------------------------------------------------- primitives */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:24px}
.page-head h1{font-size:32px;letter-spacing:-.035em;font-weight:800;background:linear-gradient(120deg,var(--ink) 30%,var(--act) 80%,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.page-head p{color:var(--muted);max-width:68ch;margin-top:6px;font-size:14.5px}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:22px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g-2-3{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
@media (max-width:1100px){.g-3-2,.g-2-3{grid-template-columns:1fr}}
@media (max-width:760px){.g-2{grid-template-columns:1fr}}

.panel{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--rule);border-radius:var(--r-l);min-width:0;box-shadow:var(--shadow-1)}
.panel > header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.panel > header h2{font-size:15px;font-weight:700}
.panel > header .sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.panel > .body{padding:18px 20px}
.panel > .body.flush{padding:0}
.panel > footer{padding:13px 20px;border-top:1px solid var(--rule);background:var(--raised);border-radius:0 0 var(--r-l) var(--r-l)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--rule-2);background:var(--solid);
  font-weight:650;font-size:13.5px;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,box-shadow .15s,background .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.btn.primary:hover{background:var(--grad);filter:brightness(1.08);box-shadow:0 12px 28px -6px rgba(124,58,237,.65)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.small{height:30px;padding:0 12px;font-size:12.5px}
.btn.danger{color:var(--fail)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.icon{width:38px;padding:0}

.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.b-go,.b-pass,.b-done,.b-confirmed,.b-approved{background:var(--pass-soft);color:var(--pass)}
.b-needs_review,.b-unknown,.b-escalated,.b-pending,.b-retry{background:var(--rev-soft);color:var(--rev)}
.b-no_go,.b-fail,.b-aborted,.b-rejected{background:var(--fail-soft);color:var(--fail)}
.b-active,.b-info{background:var(--info-soft);color:var(--info)}
.b-excluded,.b-plain{background:var(--sunk);color:var(--muted)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.chip.act{background:var(--act-soft);color:var(--act)}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.score small{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:2px}

input[type=text],input[type=search],input[type=password],textarea,select{background:var(--solid);border:1px solid var(--rule-2);border-radius:12px;padding:9px 13px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--act);box-shadow:0 0 0 4px color-mix(in srgb,var(--act) 18%,transparent)}
textarea{min-height:120px;resize:vertical;font:13px/1.6 var(--mono)}
label.f{display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:650;color:var(--ink-2)}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:44px 18px;color:var(--muted)}
.empty b{color:var(--ink);font-weight:700}
.empty .btn{margin-top:4px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--sunk) 0%,var(--act-soft) 50%,var(--sunk) 100%);background-size:200% 100%;animation:sk 1.4s ease infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.content > *{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.spin,.skel,.content > *{animation:none}}

.toasts{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:90;max-width:min(420px,calc(100vw - 36px))}
.toast{background:#16132b;color:#f1efff;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow-pop);font-size:13.5px;display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(255,255,255,.08);animation:rise .25s ease both}
.toast svg{margin-top:2px;color:#34d399} .toast.err svg{color:#fb7185}

/* ---------------------------------------------------------------- gate strip (signature) */
.strip{display:inline-flex;align-items:center;gap:3px}
.strip .seg{width:28px;height:22px;display:grid;place-items:center;font:700 10.5px var(--mono);color:#fff;background:var(--na);border-radius:7px}
.strip .seg.pass{background:linear-gradient(160deg,#34d399,#059669)} .strip .seg.fail{background:linear-gradient(160deg,#fb7185,#e11d48)} .strip .seg.unknown{background:linear-gradient(160deg,#fcd34d,#f59e0b)}
.strip .seg.skip{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--rule-2)}
.strip .bonus{margin-left:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--mono);box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--faint)}
.strip .bonus.pass{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.strip.lg .seg{width:auto;min-width:0;flex:1;height:34px;font-size:12px;padding:0 12px;justify-content:start;display:flex;align-items:center;gap:6px;border-radius:10px}
.strip.lg{display:flex;width:100%;gap:5px}
.strip .gl{font-family:var(--sans);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.strip.lg .gl{display:none}.strip.lg .seg{justify-content:center}}
.strip.lg .bonus{width:auto;height:34px;border-radius:999px;padding:0 14px;font-size:12px;gap:6px;display:flex;align-items:center}

/* ---------------------------------------------------------------- overview */
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.fstage{padding:18px 18px 16px;border:1px solid var(--rule);border-radius:var(--r-l);background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;position:relative;min-width:0;overflow:hidden;transition:transform .15s,box-shadow .15s}
.fstage::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.85}
a.fstage:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.fstage .lbl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.fstage .val{font-size:34px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.fstage .conv{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fstage .meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.fstage .meter i{display:block;height:100%;background:var(--grad);border-radius:99px}
@media (max-width:1100px){.funnel{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.attn{display:flex;flex-direction:column}
.attn a,.attn div.item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--rule);color:inherit;text-decoration:none}
.attn a:last-child,.attn div.item:last-child{border-bottom:0}
.attn a:hover{background:var(--raised)}
.attn .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.attn .ic.rev{background:var(--rev-soft);color:var(--rev)} .attn .ic.act{background:var(--act-soft);color:var(--act)} .attn .ic.pass{background:var(--pass-soft);color:var(--pass)}
.attn .t{font-weight:650;display:block} .attn .d{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:16px}
.bar-row .top-l{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:7px}
.bar-row .track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar-row .track i{display:block;height:100%;background:linear-gradient(90deg,#fb7185,#f43f5e);border-radius:99px}
.pipeline-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:14px}
.pstep{padding:14px 16px;border-radius:14px;background:var(--raised);border:1px solid var(--rule);display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;min-width:0;transition:border-color .15s,background .15s}
.pstep:hover{border-color:color-mix(in srgb,var(--act) 40%,transparent);background:var(--act-soft)}
.pstep .n{font:700 11px var(--mono);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content}
.pstep b{font-weight:700}
.pstep p{font-size:12.5px;color:var(--muted)}
@media (max-width:1000px){.pipeline-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------------------------------------------------------------- tables */
.tablewrap{overflow-x:auto}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.data th{text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--raised);white-space:nowrap;position:sticky;top:0}
table.data th:first-child{border-top-left-radius:var(--r-l)} table.data th:last-child{border-top-right-radius:var(--r-l)}
table.data th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
table.data th button:hover{color:var(--ink)}
table.data td.nw,table.data th{white-space:nowrap}
table.data td{padding:14px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr.click{cursor:pointer}
table.data tbody tr.click:hover td{background:var(--act-soft)}
.co{display:flex;align-items:center;gap:12px;min-width:180px}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;color:#fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.35);background-image:linear-gradient(160deg,rgba(255,255,255,.25),transparent 60%)!important}
.co > div > b{display:block;font-weight:700}
.co > div > span{display:block;font:12px var(--mono);color:var(--muted)}
.person-cell b{font-weight:650;display:block}
.person-cell span{font-size:12px;color:var(--muted)}
.why-cell{color:var(--ink-2);max-width:360px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabs{display:inline-flex;gap:3px;padding:4px;border-radius:999px;background:var(--sunk);border:1px solid var(--rule)}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:650;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--solid);color:var(--ink);box-shadow:0 2px 8px -2px rgba(40,20,110,.25)}
.tabs button .c{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:4px;display:block}

/* ---------------------------------------------------------------- account detail */
.dhero{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-start;justify-content:space-between;margin-bottom:20px;padding:22px;border-radius:24px;background:var(--grad-soft);border:1px solid var(--rule)}
.dhero .id{display:flex;gap:16px;align-items:center}
.dhero .logo{width:56px;height:56px;border-radius:16px;font-size:19px}
.dhero h1{font-size:30px;letter-spacing:-.035em;font-weight:800}
.dhero .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--muted)}
.verdict{padding:16px 20px;border-radius:var(--r-l);border:1px solid var(--rule);background:var(--surface);box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.verdict p{font-size:14.5px;color:var(--ink-2)}
.subnav{display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--rule);margin-bottom:22px;overflow-x:auto;scrollbar-width:none;position:sticky;top:82px;
  background:color-mix(in srgb,var(--solid) 75%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5;width:max-content;max-width:100%}
.subnav a{padding:7px 15px;color:var(--muted);text-decoration:none;font-weight:650;border-radius:999px;white-space:nowrap}
.subnav a:hover{color:var(--ink)}
.subnav a.on{color:#fff;background:var(--grad);box-shadow:var(--glow)}
section.anchor{scroll-margin-top:140px}
.gates{display:flex;flex-direction:column}
.gate{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;padding:18px 20px;border-bottom:1px solid var(--rule)}
.gate:last-child{border-bottom:0}
.gate .code{height:28px;border-radius:9px;display:grid;place-items:center;font:700 11.5px var(--mono);color:#fff;background:var(--na)}
.gate .code.pass{background:linear-gradient(160deg,#34d399,#059669)} .gate .code.fail{background:linear-gradient(160deg,#fb7185,#e11d48)} .gate .code.unknown{background:linear-gradient(160deg,#fcd34d,#f59e0b)}
.gate h3{font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gate .reason{color:var(--muted);font-size:13px;margin-top:2px}
.quote{margin:10px 0 0;padding:11px 14px;border-left:3px solid transparent;border-image:var(--grad) 1;background:var(--raised);font-size:13px;color:var(--ink-2)}
.quote .src{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.quote .src a{color:var(--act);text-decoration:none;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.factors{display:flex;flex-wrap:wrap;gap:6px}
.people{display:flex;flex-direction:column}
.person{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.person:last-child{border-bottom:0}
.person.primary{background:var(--grad-soft)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--sunk);color:var(--ink-2)}
.person.primary .avatar{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.person .nm{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.person .tt{font-size:13px;color:var(--muted)}
.person .em{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.person .em code{font:12.5px var(--mono);background:var(--sunk);padding:4px 9px;border-radius:8px;overflow-wrap:anywhere}
.person .note{font-size:12px;color:var(--muted);margin-top:4px}
.person .warn{font-size:12.5px;color:var(--rev);margin-top:4px;display:flex;gap:6px;align-items:flex-start}
.mail{border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden;background:var(--solid);box-shadow:var(--shadow-1)}
.mail .hd{padding:14px 18px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;font-size:13px;background:var(--raised)}
.mail .hd .k{color:var(--muted)}
.mail .hd .s{font-weight:700}
.mail .bd{padding:20px 18px;white-space:pre-wrap;font-size:14px;line-height:1.75;max-width:72ch}
.hook{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:13px 16px;border-radius:var(--r-m);background:var(--grad-soft);border:1px solid color-mix(in srgb,var(--act) 20%,transparent);font-size:13px}
.hook svg{color:var(--act);margin-top:2px}
.pains{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.pains{grid-template-columns:1fr}}
.pain{border:1px solid var(--rule);border-radius:var(--r-m);padding:14px 16px;font-size:13px;background:var(--raised)}
.pain b{display:block;margin-bottom:2px}
.pain span{color:var(--muted)}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:800px){.meters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mt{border:1px solid var(--rule);border-radius:var(--r-m);padding:14px 16px;background:var(--raised)}
.mt .l{font-size:12px;color:var(--muted);font-weight:600}
.mt .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.mt .v small{font-size:12px;color:var(--muted);font-weight:500}
.mt .track{height:6px;background:var(--sunk);border-radius:99px;margin-top:8px;overflow:hidden}
.mt .track i{display:block;height:100%;background:var(--grad)}
.passes{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.rpass{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px}
.rpass .pn{font-weight:700;font-size:13px}
.rpass .pn small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.rpass .why{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.ract{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:12px var(--mono);background:var(--sunk);color:var(--ink-2)}
.ract i{width:6px;height:6px;border-radius:50%;background:var(--faint);display:block}
.ract.ok i{background:var(--pass-bar)} .ract.bad i{background:var(--fail-bar)} .ract.meh i{background:var(--rev-bar)}
.fb{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px}
@media (max-width:760px){.fb{grid-template-columns:1fr}}
.stars{display:flex;gap:6px}
.stars button{width:38px;height:38px;border-radius:12px;border:1px solid var(--rule-2);background:var(--solid);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums;transition:transform .12s}
.stars button:hover{transform:translateY(-1px)}
.stars button[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}

/* ---------------------------------------------------------------- agent */
.state{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.state{grid-template-columns:repeat(2,minmax(0,1fr))}}
.state div{padding:12px 14px;border:1px solid var(--rule);border-radius:14px;background:var(--raised);min-width:0}
.state .k{font-size:11.5px;color:var(--muted);display:block;font-weight:600}
.state .v{display:block;font-weight:700;font-size:13.5px;overflow-wrap:anywhere}
.state .f{display:block;font:11px var(--mono);color:var(--faint)}
.timeline{display:flex;flex-direction:column;position:relative}
.tl{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding-bottom:18px;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:linear-gradient(var(--rule-2),transparent)}
.tl:last-child::before{display:none}
.tl .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);z-index:1}
.tl .dot svg{width:12px;height:12px}
.tl .dot.ok{background:var(--pass-soft);color:var(--pass)} .tl .dot.bad{background:var(--fail-soft);color:var(--fail)} .tl .dot.esc{background:var(--rev-soft);color:var(--rev)}
.tl .w{font-weight:650;font-size:13.5px}
.tl .d{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tl .when{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.threads{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.threads{grid-template-columns:1fr}}
.tlist{display:flex;flex-direction:column;padding:6px}
.tlist button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-radius:14px}
.tlist button:hover{background:var(--raised)}
.tlist button[aria-current="true"]{background:var(--grad-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--act) 30%,transparent)}
.tlist .n{font-weight:700}
.tlist .s{font-size:12.5px;color:var(--muted);grid-column:1/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.callout{display:flex;gap:10px;padding:12px 16px;border-radius:var(--r-m);background:var(--rev-soft);font-size:13px;color:var(--ink-2)}
.callout svg{color:var(--rev);margin-top:2px}
.tools{display:flex;flex-direction:column}
.tool{padding:16px 20px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}
.tool:last-child{border-bottom:0}
.tool .ic{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:var(--glow)}
.tool code{font:700 12.5px var(--mono)}
.tool p{font-size:13px;color:var(--ink-2);margin-top:3px}
.tool .rt{font-size:12px;color:var(--muted);margin-top:6px}
table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.kv tr:last-child td{border-bottom:0}
table.kv td:first-child{color:var(--ink-2);padding-right:14px;width:62%}
table.kv td:last-child{color:var(--muted)}

/* ---------------------------------------------------------------- find */
.cands{display:flex;flex-direction:column;max-height:480px;overflow:auto}
.cand{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding:13px 20px;border-bottom:1px solid var(--rule);cursor:pointer}
.cand:last-child{border-bottom:0}
.cand:hover{background:var(--raised)}
.cand.off{opacity:.55;cursor:default}
.cand input{margin-top:3px;accent-color:var(--act)}
.cand .q{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.queue{display:flex;flex-direction:column}
.qi{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--rule)}
.qi:last-child{border-bottom:0}
.qi .st{display:grid;place-items:center;color:var(--muted)}
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);transition:width .3s}

/* ---------------------------------------------------------------- learning + settings */
.loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.loop div{padding:16px 18px;border:1px solid var(--rule);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow-1);font-size:13px;color:var(--muted)}
.loop b{display:block;color:var(--ink);font-weight:700;margin-bottom:2px}
.loop .n{font:700 11.5px var(--mono);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:860px){.loop{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lesson{padding:18px 20px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.lesson:last-child{border-bottom:0}
.lesson .txt{font-weight:700;font-size:14.5px}
.lesson .why{font-size:13px;color:var(--muted)}
.checks{display:flex;flex-direction:column}
.check{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;padding:14px 20px;border-bottom:1px solid var(--rule);align-items:start}
.check:last-child{border-bottom:0}
.check .ok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.check .ok.y{background:var(--pass-soft);color:var(--pass)} .check .ok.n{background:var(--fail-soft);color:var(--fail)} .check .ok.o{background:var(--sunk);color:var(--muted)}
.check b{font-weight:700}
.check p{font-size:12.5px;color:var(--muted)}
.check code{font:12px var(--mono);background:var(--sunk);padding:2px 7px;border-radius:6px}

/* ---------------------------------------------------------------- auth */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth .card{width:min(420px,100%);background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--rule);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-pop)}
.auth .brand{color:var(--ink);padding:0}
.auth h1{font-size:24px;font-weight:800}
.auth .err{color:var(--fail);font-size:13px}
</style>
</head>

  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================== utilities */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (n, cls="") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + "s")}`;
const initials = n => (n || "?").replace(/[^\p{L}\p{N}\s]/gu, "").split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase() || "?";
const hue = s => [...(s || "")].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const logo = (name, domain) => `<span class="logo" style="background:hsl(${hue(domain)} 42% 42%)">${esc(initials(name))}</span>`;
let TZ = "Asia/Kolkata";
const fmt = (iso, opts) => { if(!iso) return ""; try { return new Intl.DateTimeFormat(undefined, {timeZone: TZ, ...opts}).format(new Date(String(iso).replace(" ", "T"))); } catch { return String(iso); } };
const fmtSlot = iso => fmt(iso, {weekday:"short", day:"numeric", month:"short", hour:"numeric", minute:"2-digit"});
const fmtStamp = iso => fmt(iso, {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
const ago = iso => { const t = new Date(String(iso).replace(" ", "T")).getTime(); if(!t) return ""; const m = Math.round((Date.now()-t)/60000);
  return m < 1 ? "just now" : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m/60)}h ago` : `${Math.round(m/1440)}d ago`; };

function toast(msg, kind="ok"){
  const el = document.createElement("div"); el.className = `toast ${kind === "err" ? "err" : ""}`;
  el.innerHTML = `${icon(kind === "err" ? "alert" : "check")}<span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), kind === "err" ? 7000 : 3600);
}
class ApiError extends Error { constructor(msg, status, code){ super(msg); this.status = status; this.code = code; } }
async function api(path, opts={}, timeoutMs=300000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs);
  let r;
  try { r = await fetch(path, {headers:{"Content-Type":"application/json"}, credentials:"same-origin", signal: ctl.signal, ...opts}); }
  catch(e){ throw new ApiError(e.name === "AbortError" ? "The request took too long and was stopped. Try again." : "Can't reach the server. Check your connection and try again.", 0); }
  finally { clearTimeout(t); }
  const j = await r.json().catch(() => ({error: `The server returned an unexpected response (HTTP ${r.status}).`}));
  if(r.status === 401 && !path.endsWith("/login")){ boot(); throw new ApiError("Your session ended. Sign in again.", 401); }
  if(!r.ok) throw new ApiError(j.error || `Request failed (HTTP ${r.status}).`, r.status, j.code);
  return j;
}
const post = (p, b={}) => api(p, {method:"POST", body: JSON.stringify(b)});
async function copy(t){ try { await navigator.clipboard.writeText(t); toast("Copied to clipboard"); } catch { toast("Couldn't copy. Select the text and copy it instead.", "err"); } }

/* ============================================================== vocabulary */
const STATUS = {go:"Qualified", needs_review:"Needs review", no_go:"Not a fit", retry:"Retry", excluded:"Excluded",
  active:"In conversation", done:"Closed", escalated:"Handed to you", aborted:"Stopped", pending:"Awaiting approval", approved:"Approved", rejected:"Rejected"};
const GATE = {G1:"B2B software", G5:"No SOC 2 / ISO yet", G3:"100–1,000 staff", G2:"Series A–C", G4:"Compliance pressure"};
const GORDER = ["G1","G5","G3","G2"]; // G4 adds points only; drawn separately
const badge = (s, txt) => `<span class="badge b-${esc(s)}">${esc(txt || STATUS[s] || s)}</span>`;
function strip(g, large){
  g = g || {};
  const segs = GORDER.map(k => { const s = (g[k] || {}).status; const cls = s || "skip";
    return `<span class="seg ${cls}" title="${esc(k)} ${esc(GATE[k])}: ${esc(s ? ({pass:"proven",fail:"failed",unknown:"couldn't be answered"})[s] || s : "not checked")}">${large ? `${esc(k)} <span class="gl">${esc(GATE[k])}</span>` : esc(k)}</span>`; }).join("");
  const b = (g.G4 || {}).status;
  const bonus = `<span class="bonus ${b === "pass" ? "pass" : ""}" title="G4 compliance pressure: ${b === "pass" ? "found (+3)" : "not found"}">${large ? `G4 <span class="gl">+3 ${esc(GATE.G4)}</span>` : "G4"}</span>`;
  return `<span class="strip ${large ? "lg" : ""}" role="img" aria-label="Qualification gates">${segs}${bonus}</span>`;
}
function shortWhy(a){
  if(a.status === "go") return a.draft ? "Every fit gate passed. Email drafted." : "Every fit gate passed.";
  const r = a.reason || "";
  const m = r.match(/^(G\d) failed: (.*)$/);
  if(m) return `${GATE[m[1]] || m[1]}: ${m[2]}`;
  return r.replace(/^unanswered after loop: /, "Couldn't answer: ").replace(/^no contact: /, "No usable contact: ").replace(/^pipeline error: /, "Research error: ");
}
function plainReason(r){
  if(!r) return "";
  if(r.includes("HUBSPOT_TOKEN")) return "Couldn't log it in the CRM, so it's yours to record.";
  return r.replace(/^[a-z_]+:\s*/, "").replace(/_/g, " ");
}

/* ============================================================== state + data */
const S = {config:null, me:null, cache:{}, accFilter:"go", accQuery:"", accSort:{k:"status", dir:1}, candidates:[], researching:false, thread:null, rating:null};
const PATHS = {accounts:"/api/accounts", overview:"/api/overview", threads:"/api/agent/threads", lessons:"/api/lessons", meta:"/api/agent/meta", settings:"/api/settings"};
async function load(key, force){
  if(S.cache[key] && !force) return S.cache[key];
  const j = await api(PATHS[key], {}, 60000);
  S.cache[key] = key === "accounts" ? j.accounts : key === "threads" ? j.threads : j;
  return S.cache[key];
}
const invalidate = (...k) => k.forEach(x => delete S.cache[x]);

/* ============================================================== shell */
const NAV = [
  ["overview","Overview","grid"], ["accounts","Accounts","building"], ["find","Find accounts","radar"],
  ["agent","Reply agent","inbox"], ["learning","Learning","spark"], ["settings","Settings","sliders"]];
function shell(){
  const c = S.config || {};
  $("#app").innerHTML = `
  <div class="shell">
    <aside class="side" id="side" aria-label="Main navigation">
      <a class="brand" href="#overview"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>${esc(c.app_name || "Prospect Studio")}</b></a>
      <div class="ws"><div class="k">Selling for</div><div class="v">${esc(c.seller?.name || "—")}<span id="credits" title="Hunter credits left this month">…</span></div></div>
      <nav class="nav">
        ${NAV.slice(0,5).map(([r,l,i]) => `<a href="#${r}" data-r="${r}">${icon(i)}${l}<span class="count" id="n-${r}"></span></a>`).join("")}
        <div class="grp">Workspace</div>
        ${NAV.slice(5).map(([r,l,i]) => `<a href="#${r}" data-r="${r}">${icon(i)}${l}<span class="count" id="n-${r}"></span></a>`).join("")}
      </nav>
      <div class="side-foot">
        <div class="health" id="health"></div>
        <div class="links">
          ${c.links?.repo ? `<a href="${esc(safeUrl(c.links.repo))}" target="_blank" rel="noopener">Source</a>` : ""}
          ${c.links?.report ? `<a href="${esc(safeUrl(c.links.report))}" target="_blank" rel="noopener">Report</a>` : ""}
          <button type="button" id="theme">${icon("moon")} Theme</button>
          <span class="faint">v${esc(c.version || "")}</span>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="top">
        <button class="btn icon ghost menu" id="menu" aria-label="Open navigation">${icon("menu")}</button>
        <div class="crumbs" id="crumbs"></div>
        <label class="search"><span class="sr">Search accounts</span>${icon("search")}<input type="search" id="gsearch" placeholder="Search accounts" autocomplete="off"><kbd>/</kbd></label>
        <a class="btn primary top-cta" href="#find" aria-label="Find accounts">${icon("radar")}<span>Find accounts</span></a>
      </header>
      <main class="content" id="main" tabindex="-1"></main>
    </div>
  </div>`;
  $("#menu").onclick = () => document.body.classList.add("nav-open");
  $("#scrim").onclick = () => document.body.classList.remove("nav-open");
  $("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nxt = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nxt; try { localStorage.setItem("od-theme", nxt); } catch {} };
  $("#gsearch").addEventListener("input", e => { S.accQuery = e.target.value; S.accFilter = S.accQuery ? "all" : S.accFilter;
    if(!location.hash.startsWith("#accounts")) location.hash = "#accounts"; else drawAccounts(); });
  document.addEventListener("keydown", e => { if(e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); $("#gsearch").focus(); }
    if(e.key === "Escape") document.body.classList.remove("nav-open"); });
}
function counts(){
  const set = (id, v, hot) => { const el = $(`#n-${id}`); if(el){ el.textContent = v || ""; el.classList.toggle("hot", !!hot && !!v); } };
  if(S.cache.accounts) set("accounts", S.cache.accounts.length);
  if(S.cache.threads){ const esc_ = S.cache.threads.filter(t => t.status === "escalated").length; set("agent", esc_ || S.cache.threads.filter(t => t.status === "active").length, esc_); }
  if(S.cache.lessons){ const p = S.cache.lessons.lessons.filter(l => l.status === "pending").length; set("learning", p, p); }
}
async function healthDots(){
  try { const h = await api("/api/health", {}, 15000); const i = h.integrations || {};
    const items = [["llm","AI model"],["hunter","Hunter"],["google","Gmail"],["database","Database"]];
    $("#health").innerHTML = items.map(([k,l]) => `<span title="${l}: ${i[k] ? "connected" : "not set up"}"><i class="${i[k] ? "on" : ""}"></i>${l}</span>`).join("");
  } catch { $("#health").innerHTML = ""; }
}
function crumbs(parts){
  $("#crumbs").innerHTML = parts.map((p, i) => i < parts.length - 1 ? `<a href="${p[1]}">${esc(p[0])}</a><span class="sep">/</span>` : `<span class="cur">${esc(p[0])}</span>`).join("");
  document.title = `${parts[parts.length-1][0]} · ${S.config?.app_name || "Prospect Studio"}`;
}

/* ============================================================== router */
const routes = {overview: vOverview, accounts: vAccounts, account: vAccount, find: vFind, agent: vAgent, learning: vLearning, settings: vSettings};
let routeSeq = 0;
async function route(){
  const seq = ++routeSeq;
  const h = location.hash.replace(/^#/, "") || "overview";
  const [name, ...rest] = h.split("/");
  const fn = routes[name] || vOverview;
  const navKey = name === "account" ? "accounts" : (routes[name] ? name : "overview");
  $$(".nav a").forEach(a => a.dataset.r === navKey ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.body.classList.remove("nav-open");
  const main = $("#main");
  main.innerHTML = loadingView();
  try {
    const html = await fn(decodeURIComponent(rest.join("/")));
    if(seq !== routeSeq) return;
    main.innerHTML = banner() + html;
    bind(name);
  } catch(err){
    if(seq !== routeSeq) return;
    if(err.status === 401) return;
    main.innerHTML = banner() + `<div class="panel"><div class="empty">${icon("alert")}<b>This screen didn't load</b><span>${esc(err.message)}</span><button class="btn" id="retry">${icon("refresh")}Try again</button></div></div>`;
    $("#retry").onclick = route;
  }
  counts();
  if(route.ran) window.scrollTo(0, 0); route.ran = true;
}
const loadingView = () => `<div class="stack"><div class="skel" style="height:34px;width:240px"></div><div class="skel" style="height:110px"></div><div class="grid g-3-2"><div class="skel" style="height:260px"></div><div class="skel" style="height:260px"></div></div></div>`;
function banner(){
  if(S.me?.demo) return `<div class="banner">${icon("info")}<span><b>Demo workspace.</b> These companies are fictional (every domain ends in .example) and changes reset when the server restarts. Connect a database and API keys in <a href="#settings">Settings</a> to run real research.</span></div>`;
  return "";
}

/* ============================================================== overview */
async function vOverview(){
  crumbs([["Overview"]]);
  const [o, accs] = await Promise.all([load("overview", true), load("accounts")]);
  const F = o.funnel, top = F[0].n || 0;
  const funnel = F.map((f, i) => { const prev = i ? F[i-1].n : null; const conv = prev ? Math.round(100 * f.n / prev) : null;
    const href = {researched:"#accounts/all", qualified:"#accounts/go", contact:"#accounts/go", contacted:"#agent", replied:"#agent", booked:"#agent"}[f.key];
    return `<a class="fstage" href="${href}"><span class="lbl">${esc(f.label)}</span><span class="val">${f.n}</span>
      <span class="conv">${i === 0 ? "companies checked" : prev ? `${conv}% of previous` : "—"}</span><span class="meter"><i style="width:${top ? Math.max(f.n ? 3 : 0, 100 * f.n / top) : 0}%"></i></span></a>`; }).join("");
  const a = o.attention;
  const attn = [
    ...a.escalated.map(e => `<a href="#agent/${encodeURIComponent(e.domain)}"><span class="ic rev">${icon("hand")}</span><span><span class="t">${esc(e.company || e.domain)} was handed to you</span><span class="d">${esc(plainReason(e.reason) || "The agent needs a person to take over.")}</span></span>${icon("arrow","faint")}</a>`),
    a.pending_lessons ? `<a href="#learning"><span class="ic act">${icon("spark")}</span><span><span class="t">${plural(a.pending_lessons, "lesson")} to approve</span><span class="d">Approved lessons shape the next drafts.</span></span>${icon("arrow","faint")}</a>` : "",
    a.needs_review ? `<a href="#accounts/needs_review"><span class="ic rev">${icon("alert")}</span><span><span class="t">${plural(a.needs_review, "account")} need a human look</span><span class="d">A gate couldn't be proven either way from public sources.</span></span>${icon("arrow","faint")}</a>` : "",
    a.active_threads ? `<a href="#agent"><span class="ic act">${icon("inbox")}</span><span><span class="t">${plural(a.active_threads, "conversation")} in progress</span><span class="d">The agent checks for replies every 15 minutes.</span></span>${icon("arrow","faint")}</a>` : "",
  ].filter(Boolean).join("") || `<div class="item"><span class="ic pass">${icon("check")}</span><span><span class="t">You're all caught up</span><span class="d">Nothing is waiting on you right now.</span></span><span></span></div>`;
  const maxR = Math.max(1, ...o.rejected_by.map(r => r.n));
  const reasons = o.rejected_by.length ? `<div class="bars">${o.rejected_by.map(r => `<div class="bar-row"><div class="top-l"><span><b>${esc(r.label)}</b> <span class="muted mono">${esc(r.gate)}</span></span><span class="num">${r.n}</span></div><div class="track"><i style="width:${100*r.n/maxR}%"></i></div></div>`).join("")}</div>`
    : `<div class="empty" style="padding:18px">No rejections yet.</div>`;
  const go = accs.filter(x => x.status === "go").sort((x, y) => (y.score || 0) - (x.score || 0)).slice(0, 6);
  const goRows = go.length ? `<div class="tablewrap"><table class="data"><thead><tr><th>Company</th><th>Gates</th><th>Score</th><th>Contact</th><th></th></tr></thead><tbody>${go.map(x => { const p = x.people[0];
      return `<tr class="click" data-href="#account/${encodeURIComponent(x.domain)}"><td><div class="co">${logo(x.name, x.domain)}<div><b>${esc(x.name)}</b><span>${esc(x.domain)}</span></div></div></td><td>${strip(x.gates)}</td>
      <td><span class="score">${x.score ?? "–"}<small>pts</small></span></td><td class="person-cell">${p ? `<b>${esc(p.name)}</b><span>${esc(p.title || "")}</span>` : `<span class="muted">No contact yet</span>`}</td>
      <td>${x.sent ? badge("done", "Sent") : x.draft ? `<span class="chip act">Draft ready</span>` : ""}</td></tr>`; }).join("")}</tbody></table></div>`
    : `<div class="empty"><b>No qualified accounts yet</b><span>Find companies in funding news or paste a list of domains to start.</span><a class="btn primary" href="#find">${icon("radar")}Find accounts</a></div>`;
  const steps = [["Research","Free news, job boards and Wikidata first; the company's own pages last.","accounts"],["Qualify","Gates in order, each settled by a quoted source.","accounts"],
    ["Find the person","Hunter search, title ranking, email verification.","accounts"],["Draft","One cited hook and two pains for that role.","accounts"],
    ["Handle replies","Proposes times, books, logs, or hands off.","agent"],["Learn","Approved lessons shape the next drafts.","learning"]];
  return `
    <div class="page-head"><div><h1>Pipeline</h1><p>Every company is researched, qualified against your ideal-customer gates with quoted evidence, matched to a verified decision-maker and drafted to. Nothing goes to a prospect: drafts go to your own inbox.</p></div>
      <div class="row"><a class="btn" href="#agent">${icon("inbox")}Check replies</a></div></div>
    <div class="stack">
      <div class="funnel" aria-label="Pipeline funnel">${funnel}</div>
      <div class="grid g-3-2">
        <section class="panel"><header><div><h2>Top qualified accounts</h2><div class="sub">Ranked by fit score; G4 compliance pressure adds 3 points.</div></div><a class="btn small" href="#accounts/go">View all</a></header><div class="body flush">${goRows}</div></section>
        <div class="stack">
          <section class="panel"><header><h2>Needs you</h2></header><div class="body flush"><div class="attn">${attn}</div></div></section>
          <section class="panel"><header><div><h2>Why accounts were rejected</h2><div class="sub">The first gate each “not a fit” company failed.</div></div></header><div class="body">${reasons}</div></section>
        </div>
      </div>
      <section class="panel"><header><h2>How an account moves through the desk</h2></header><div class="pipeline-steps">${steps.map(([t,d,r], i) => `<a class="pstep" href="#${r}"><span class="n">Step ${i+1}</span><b>${t}</b><p>${d}</p></a>`).join("")}</div></section>
    </div>`;
}

/* ============================================================== accounts */
async function vAccounts(arg){
  crumbs([["Accounts"]]);
  if(arg && ["go","needs_review","no_go","all"].includes(arg)) S.accFilter = arg;
  await load("accounts");
  return `
    <div class="page-head"><div><h1>Accounts</h1><p>Every company the desk researched. Gates are checked in order and the first failure stops the research; anything that couldn't be proven is left for a person.</p></div>
      <a class="btn primary" href="#find">${icon("radar")}Research more</a></div>
    <section class="panel">
      <header style="flex-wrap:wrap"><div class="tabs" role="group" aria-label="Filter by status" id="ftabs"></div>
        <label class="search" style="margin-left:0;width:min(280px,100%)"><span class="sr">Filter accounts</span>${icon("search")}<input type="search" id="q" placeholder="Filter by company or domain" value="${esc(S.accQuery)}"></label></header>
      <div class="body flush" id="atable"></div>
    </section>
    <div class="legend"><span><i style="background:var(--pass-bar)"></i>Proven</span><span><i style="background:var(--fail-bar)"></i>Failed</span><span><i style="background:var(--rev-bar)"></i>Couldn't be answered</span><span><i style="box-shadow:inset 0 0 0 1px var(--rule-2)"></i>Not checked (research stopped earlier)</span>
      <span>${GORDER.map(k => `${k} ${GATE[k]}`).join(", ")}; G4 compliance pressure adds points only.</span></div>`;
}
function drawAccounts(){
  const accs = S.cache.accounts; if(!accs || !$("#atable")) return;
  const cnt = k => k === "all" ? accs.length : accs.filter(a => a.status === k || (k === "needs_review" && a.status === "retry")).length;
  $("#ftabs").innerHTML = [["go","Qualified"],["needs_review","Needs review"],["no_go","Not a fit"],["all","All"]].map(([k,l]) =>
    `<button type="button" data-f="${k}" aria-pressed="${S.accFilter === k}">${l}<span class="c">${cnt(k)}</span></button>`).join("");

  const q = S.accQuery.trim().toLowerCase();
  const order = {go:0, needs_review:1, retry:2, no_go:3};
  const {k, dir} = S.accSort;
  let list = accs.filter(a => (S.accFilter === "all" || a.status === S.accFilter || (S.accFilter === "needs_review" && a.status === "retry")) && (!q || a.name.toLowerCase().includes(q) || a.domain.includes(q)));

    if(k === "name") v = x.name.localeCompare(y.name);

  $("#atable").innerHTML = `<div class="tablewrap"><table class="data"><thead><tr>${th("name","Company")}${th("status","Status")}<th>Gates</th>${th("score","Score")}<th>Contact</th><th>Why</th>${th("date","Researched")}</tr></thead><tbody>${list.map(a => { const p = a.people[0];
    return `<tr class="click" data-href="#account/${encodeURIComponent(a.domain)}"><td><div class="co">${logo(a.name, a.domain)}<div><b>${esc(a.name)}</b><span>${esc(a.domain)}</span></div></div></td>
      <td>${badge(a.status)}</td><td>${strip(a.gates)}</td><td>${a.score != null ? `<span class="score">${a.score}<small>pts</small></span>` : `<span class="faint">–</span>`}</td>
      <td class="person-cell">${p ? `<b>${esc(p.name)}</b><span>${esc(p.title || "")}</span>` : `<span class="faint">–</span>`}</td>
      <td><span class="why-cell">${esc(shortWhy(a))}</span></td><td class="num muted sm nw">${esc(a.run_date || "")}</td></tr>`; }).join("")}</tbody></table></div>`;
  $$("#atable [data-sort]").forEach(b => b.onclick = () => { const key = b.dataset.sort; S.accSort = {k: key, dir: S.accSort.k === key ? -S.accSort.dir : 1}; drawAccounts(); });
  bindRows($("#atable"));
}
function bindRows(root){ $$("tr[data-href]", root).forEach(tr => { tr.tabIndex = 0; tr.onclick = () => location.hash = tr.dataset.href; tr.onkeydown = e => { if(e.key === "Enter") location.hash = tr.dataset.href; }; }); }

const SF = [["reply_status","Prospect's reply",{no_reply:"No reply yet",interested:"Interested",counter_proposed:"Asked for another time",confirmed:"Confirmed a time",not_interested:"Not interested",unclear:"Unclear"}],
  ["calendar_checked","Calendar checked",{true:"Yes",false:"No"}],["times_proposed","Times offered",null],["reply_round","Counter-proposals",null],
  ["meeting_status","Meeting",{unscheduled:"Not scheduled",pending_confirmation:"Awaiting confirmation",confirmed:"Booked"}],["crm_logged","Logged in CRM",{true:"Yes",false:"No"}]];
function stateGrid(s){
  return `<div class="state">${SF.map(([k,l,m]) => { let v = s[k];
    if(k === "times_proposed") v = (v || []).length ? v.map(fmtSlot).join(", ") : "None yet";
    else if(k === "reply_round") v = `${v || 0} of 2`;
    else if(m) v = m[String(v)] ?? String(v ?? "–");
    return `<div><span class="k">${l}</span><span class="v">${esc(v)}</span><span class="f">${k}</span></div>`; }).join("")}</div>`;
}
function eventText(e){
  const d = e.detail || "";
  if(e.node === "start") return ["Draft sent to your inbox", "", "ok", "send"];
  if(e.node === "read_inbox"){
    if(e.outcome === "classified"){ const [intent, ...why] = d.split(": "); return [`Read the reply: ${({interested:"interested",confirm:"confirms a time",counter_propose:"asks for another time",not_interested:"not interested",unclear:"unclear"})[intent] || intent}`, why.join(": "), "ok", "inbox"]; }
    if(e.outcome === "no_new_reply") return ["Checked the inbox: no new reply", "", "", "clock"];
    if(e.outcome === "silence_timeout") return ["No reply in time: handed to you", "", "esc", "hand"];
    return ["Couldn't read the inbox this time", d, "bad", "alert"];
  }
  if(e.node === "escalate") return ["Handed the thread to you", d, "esc", "hand"];
  if(e.node === "counter") return [e.outcome === "round_cap" ? "Second counter-proposal: handed to you" : `Counter-proposal, ${e.outcome}`, "", e.outcome === "round_cap" ? "esc" : "", "cal"];
  const tool = e.tool || e.node;
  if(e.outcome === "ok") return [({check_calendar:"Checked the calendar", propose_time:"Proposed meeting times", book_meeting:"Booked the meeting", send_email: e.node === "book_meeting" ? "Sent the confirmation" : "Sent an email", update_crm:"Logged the outcome in the CRM"})[tool] || `${tool} ran`, d, "ok", {check_calendar:"cal", propose_time:"clock", book_meeting:"cal", update_crm:"db"}[tool] || "send"];
  if(String(e.outcome).startsWith("permanent_error")) return [`${tool} failed: ${String(e.outcome).split("-> ")[1] === "escalate" ? "handed to you" : "stopped"}`, d, "bad", "x"];
  if(e.outcome === "transient_error") return [`${tool} didn't respond; retrying`, d, "bad", "refresh"];
  return [`${e.node}${e.tool ? ` · ${e.tool}` : ""}: ${e.outcome}`, d, "", "dot"];
}
function timeline(events){
  const ev = [...(events || [])].reverse();
  if(!ev.length) return `<p class="muted sm">No activity yet.</p>`;
  return `<div class="timeline">${ev.map(e => { const [w, d, k, ic] = eventText(e); return `<div class="tl"><span class="dot ${k}">${icon(ic)}</span><div><div class="w">${esc(w)}</div>${d ? `<div class="d">${esc(d.slice(0, 240))}</div>` : ""}<div class="when">${esc(fmtStamp(e.created_at))}</div></div></div>`; }).join("")}</div>`;
}
async function vAgent(dom){
  crumbs([["Reply agent"]]);
  const [threads, meta] = await Promise.all([load("threads", true), load("meta")]);
  const order = {escalated:0, active:1, done:2, aborted:3};
  const ts = [...threads].sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9) || String(b.updated_at).localeCompare(String(a.updated_at)));
  if(dom && ts.some(t => t.domain === dom)) S.thread = dom;
  if(!ts.some(t => t.domain === S.thread)) S.thread = ts[0]?.domain || null;
  const tools = meta.tools.map(t => `<div class="tool"><span class="ic">${icon({send_email:"send",check_calendar:"cal",propose_time:"clock",book_meeting:"cal",update_crm:"db"}[t.name] || "dot")}</span><div><code>${esc(t.name)}</code><p>${esc(t.description)}</p><p class="rt">On a timeout: retry ${t.retry.transient[0]}×, then ${esc(t.retry.transient[1])}. On a hard failure: ${esc(t.retry.permanent)}.</p></div></div>`).join("");
  return `
    <div class="page-head"><div><h1>Reply agent</h1><p>After a draft reaches your inbox, reply to it as the prospect would. The agent reads each reply and decides the next step: offer times, re-check the calendar, book, log the outcome, or hand off to you.</p></div>
      <button class="btn primary" id="tick">${icon("refresh")}Check replies now</button></div>
    <div class="stack">
      ${ts.length ? `<div class="threads"><section class="panel"><header><h2>Conversations</h2><span class="chip">${ts.length}</span></header><div class="body flush"><div class="tlist" id="tlist">${ts.map(t => `<button type="button" data-t="${esc(t.domain)}" aria-current="${t.domain === S.thread}"><span class="n">${esc(t.state.company || t.domain)}</span>${badge(t.status)}<span class="s">${esc([t.state.contact?.first_name, t.state.contact?.position].filter(Boolean).join(", "))}${t.updated_at ? ` · updated ${esc(ago(t.updated_at))}` : ""}</span></button>`).join("")}</div></div></section>
        <div id="tdetail"></div></div>`
      : `<section class="panel"><div class="empty">${icon("inbox")}<b>No conversations yet</b><span>Open a qualified account and choose “Send to my inbox and start the agent”.</span><a class="btn" href="#accounts/go">See qualified accounts</a></div></section>`}
      <div class="grid g-2">
        <section class="panel"><header><div><h2>Tools</h2><div class="sub">The model sees only these descriptions. Failures follow a fixed retry table.</div></div></header><div class="body flush"><div class="tools">${tools}</div></div></section>
        <div class="stack">
          <section class="panel"><header><h2>When it hands off to you</h2></header><div class="body"><table class="kv"><tbody>
            <tr><td>A second counter-proposal without a confirmed time</td><td>Hands off</td></tr>
            <tr><td>No reply within ${esc(meta.no_reply_hours)} hours</td><td>Hands off</td></tr>
            <tr><td>A reply it can't classify, or a yes without a time</td><td>Hands off; never guesses a time</td></tr>
            <tr><td>A tool fails</td><td>Follows the retry table</td></tr></tbody></table></div></section>
          <section class="panel"><header><div><h2>State it keeps</h2><div class="sub">Six fields, read and written at every step, saved between checks.</div></div></header><div class="body"><table class="kv"><tbody>${SF.map(([k,l]) => `<tr><td class="mono">${k}</td><td>${l}</td></tr>`).join("")}</tbody></table></div></section>
        </div>
      </div>
    </div>`;
}
function drawThread(){
  const box = $("#tdetail"); if(!box) return;
  const t = (S.cache.threads || []).find(x => x.domain === S.thread);
